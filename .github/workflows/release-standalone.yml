# Release of the standalone converter only (REQ023, REQ025). Push a tag
# "cwelleegread-standalone-v<version>" and this builds
# cwelleegread-standalone-<version>.zip (cwelleegread.pyz, README.md, LICENSE)
# and runs its self-test on Linux, Windows and macOS; builds the executables
# cwelleegread-<version>-{windows-x64.exe,macos-arm64,linux-x64}, each on its own
# platform, and runs each one's self-test there; and only when all of that
# passed publishes a GitHub release named after the tag with the zip and the
# three executables as assets, each with a signed build-provenance attestation
# (Sigstore, free for public repositories) that users can check with
#   gh attestation verify <file> --repo janbrogger/CwellEEGRead
# (not code signing: the OS warnings stay; docs/research/code-signing.md).
#
#   git tag cwelleegread-standalone-v0.2.0 && git push origin cwelleegread-standalone-v0.2.0
#
# The version in the tag must equal __version__ in cwelleegread/__init__.py.
name: release-standalone

on:
  push:
    tags:
      - "cwelleegread-standalone-v*"
    branches:                               # pushing a branch release/cwelleegread-standalone-v<version>
      - "release/cwelleegread-standalone-v*"  # also works; the workflow then creates the tag
  workflow_dispatch:
    inputs:
      version:
        description: "converter version, must equal __version__ in cwelleegread/__init__.py (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_version="${{ github.event.inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "branch" ]; then
            tag_version="${GITHUB_REF_NAME#release/cwelleegread-standalone-v}"
          else
            tag_version="${GITHUB_REF_NAME#cwelleegread-standalone-v}"
          fi
          pkg_version=$(sed -n 's/^__version__ = "\([0-9.]*\)"/\1/p' cwelleegread/__init__.py)
          echo "tag $tag_version, cwelleegread/__init__.py $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag version and __version__ differ" >&2; exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "tag=cwelleegread-standalone-v$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Build the archive
        run: |
          python -m pip install -q numpy scipy
          python uses/standalone/build.py --outdir dist
          unzip -l "dist/cwelleegread-standalone-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: dist/cwelleegread-standalone-${{ steps.ver.outputs.version }}.zip

  selftest:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test from the archive
        run: |
          python -m pip install -q numpy scipy
          python -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall('.')" "cwelleegread-standalone-${{ needs.build.outputs.version }}.zip"
          cd "cwelleegread-standalone-${{ needs.build.outputs.version }}"
          python cwelleegread.pyz selftest

  executables:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]    # linux-x64 (glibc 2.35+), windows-x64, macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the executable and run its self-test
        run: |
          python -m pip install -q numpy scipy pyinstaller==6.22.3 tzdata
          python uses/standalone/build.py --exe --outdir dist
          exe="$PWD/$(ls dist/cwelleegread-${{ needs.build.outputs.version }}-*)"
          cd "$RUNNER_TEMP"
          "$exe" --version
          "$exe" selftest

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.os }}
          path: dist/cwelleegread-${{ needs.build.outputs.version }}-*

  release:
    needs: [build, selftest, executables]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # publish the release
      id-token: write           # OIDC token for the Sigstore signing certificate
      attestations: write       # store the attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone

      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          merge-multiple: true

      - name: Build-provenance attestations for every asset
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            cwelleegread-standalone-${{ needs.build.outputs.version }}.zip
            cwelleegread-${{ needs.build.outputs.version }}-*

      - name: Release notes
        run: |
          v="${{ needs.build.outputs.version }}"
          {
            echo "Standalone Cadwell Arc EEG to EDF/EDF+ converter, version $v."
            echo
            echo "Executables (nothing to install, not code-signed - see the README): \`cwelleegread-$v-windows-x64.exe\`,"
            echo "\`cwelleegread-$v-macos-arm64\` (Apple silicon), \`cwelleegread-$v-linux-x64\` (glibc 2.35+)."
            echo "Or the zip: \`cwelleegread.pyz\` for Python 3.10+ with numpy and scipy (\`pip install numpy scipy\`)."
            echo "\`python cwelleegread.pyz selftest\` proves on your computer that the conversion reproduces Cadwell's own"
            echo "EDF export of the bundled test recording; \`python cwelleegread.pyz selftest EXPORT CADWELL.edf\` does the same"
            echo "for your own recording. The self-test passed on every executable and on the zip, on Linux, Windows and"
            echo "macOS, before this release was published."
            echo
            echo "Read the README in the zip for the known shortcomings."
            echo
            echo "Every file has a build-provenance attestation: \`gh attestation verify FILE --repo ${{ github.repository }}\`"
            echo "shows that it was built by this repository's release workflow from the tagged commit."
            echo "The \"Source code\" archives below are the whole repository, added by GitHub; the program is the zip above."
          } > notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: cwelleegread standalone ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: |
            cwelleegread-standalone-${{ needs.build.outputs.version }}.zip
            cwelleegread-${{ needs.build.outputs.version }}-*
