# Test suite on every push and pull request (REQ011, DES011, TST011).
#
# python:  a fresh clone, ./setup.sh (the .venv, Doorstop validation, the
#          package with its `cwelleegread` command), then the whole pytest suite
#          on the committed public test exports; the Octave/EEGLAB tests skip.
#          This is the automated form of TST011 (setup on a fresh clone).
# octave:  GNU Octave plus sparse EEGLAB and dipfit checkouts (as the
#          SessionStart hook does), then the plugin self-test and the EEGLAB
#          import test (TST013), and the plugin driven through EEGLAB's menu
#          on a virtual display (xvfb; fonts-freefont-otf for Octave's text
#          rendering) (TST017), and the screenshots for TST018 (xdotool,
#          ImageMagick), kept as the artifact eeglab-screenshots.
name: tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup (fresh clone)
        run: PYTHON=python ./setup.sh

      - name: Environment checks (TST011)
        run: |
          .venv/bin/doorstop --version
          git check-ignore -q .venv
          .venv/bin/cwelleegread --version

      - name: pytest
        run: .venv/bin/pytest -ra --durations=10

  octave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup
        run: PYTHON=python ./setup.sh

      - name: GNU Octave, EEGLAB functions and dipfit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends octave zip unzip xvfb xauth fonts-freefont-otf xdotool imagemagick
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/sccn/eeglab.git .cache/eeglab-src
          git -C .cache/eeglab-src sparse-checkout set functions
          git clone -q --depth 1 https://github.com/sccn/dipfit.git .cache/dipfit
          echo "EEGLAB_DIR=$PWD/.cache/eeglab-src" >> "$GITHUB_ENV"
          echo "DIPFIT_DIR=$PWD/.cache/dipfit" >> "$GITHUB_ENV"

      - name: Octave port, EEGLAB import and EEGLAB menu tests
        run: .venv/bin/pytest -ra tests/test_octave_port.py tests/test_eeglab_import.py tests/test_eeglab_gui.py tests/test_eeglab_screenshots.py

      - name: Screenshots for manual verification (TST018)
        if: always()
        run: .venv/bin/python tools/eeglab_screenshots.py screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeglab-screenshots
          path: screenshots/
          if-no-files-found: warn
